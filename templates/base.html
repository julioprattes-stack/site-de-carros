<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% endblock %}</title>
  <style>
    body {
        font-family: 'Open Sans', sans-serif;
        background-color: #f7f7f7;
        color: #333;
        margin: 0;
        padding: 0;
    }

    header {
        background-color: #0096c7;
        color: #fff;
        text-align: center;
    }

    footer {
        background-color: #ccc;
        color: #333;
        padding: 20px;
        text-align: center;
    }

    nav {
        background-color: #0096c7;
        color: #fff;
        height: 50px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    nav ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
    }

    nav ul li {
        margin: 0 10px;
    }

    nav ul li a {
        color: #fff;
        text-decoration: none;
        font-size: 16px;
        padding: 15px;
        transition: all 0.3s ease;
    }

    nav ul li a:hover {
        background-color: #32bbe8;
    }

    nav ul li.active a {
        background-color: #666;
    }

    nav ul li.active a:hover {
        background-color: #999;
    }

    nav {
    padding: 0 20px;
    }

    nav ul {
        align-items: center;
    }

    nav ul li form {
        margin: 0;
    }

    nav .user-greeting {
        color: #fff;
        font-size: 16px;
    }

    nav .logout-btn {
        background: none;
        border: 1px solid #fff;
        border-radius: 4px;
        color: #fff;
        cursor: pointer;
        font-family: inherit;
        font-size: 16px;
        padding: 6px 14px;
        transition: all 0.3s ease;
    }

    nav .logout-btn:hover {
        background-color: #32bbe8;
    }

    nav ul li a.btn-outline {
        border: 1px solid #fff;
        border-radius: 4px;
        padding: 6px 14px;
    }

    nav ul li a.btn-solid {
        background-color: #fff;
        border-radius: 4px;
        color: #0096c7;
        padding: 6px 14px;
    }

    nav ul li a.btn-solid:hover {
        background-color: #e0f4fb;
    }

  </style>
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><a href="{% url 'cars:cars_list' %}">Carros</a></li>
        <li><a href="{% url 'cars:new_car' %}">Cadastrar Carros</a></li>
      </ul>

      <ul>
        {% if user.is_authenticated %}
            <li><span>Olá, {{ user.username }}</span></li>
            <li>
              <form method="POST" action="{% url 'accounts:logout' %}" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="logout-btn">Sair</button>
            </form>
            </li>
            {% else %}
                <li><a href="{% url 'accounts:login' %}">Entrar</a></li>
                <li><a href="{% url 'accounts:register' %}">Cadastrar</a></li>
            {% endif %}
      </ul>
    </nav>
  </header>

  <main>
    {% block content %}
    {% endblock %}
  </main>

  <footer>
    <p>&copy; 2026 Julio Multimarcas</p>
  </footer>
</body>
</html>
