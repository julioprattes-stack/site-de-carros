{% extends 'base.html' %}

{% block title %}Cadastro{% endblock %}

{% block content %}
    <div class="card">
        <h2>Criar conta</h2>

        <form method="POST">
            {% csrf_token %}
            {{ user_form.as_p }}
            <button type="submit">Cadastrar</button>
        </form>

        <p>Já tem conta? <a href="{% url 'accounts:login' %}">Entrar</a></p>
    </div>
{% endblock %}
